# phl-feed-rebuild.yml — GATE-READY, NOT DEPLOYED.
# PHL REBUILD R2. Label: UNVERIFIED / legacy-unsigned.
#
# The COLLECT half of the rebuilt Philadelphia feed chain
# (LT-KAES-19 / LT-D6). On the ship gate this file is installed
# at .github/workflows/phl-feed-rebuild.yml in
# AutomatedTechnologies/detroit-automation-academy-public and
# the VM publisher (chain/phl_publisher.py) is armed; until then
# it does nothing and exists only in this workspace.
#
# Shape: this workflow is FETCH-ONLY. It runs the pipeline's
# collect stage and commits the raw bundle to the orphan branch
# `phl-feed-raw` (manifest.json written last = completeness
# marker). It never transforms and never writes the published
# data tree — the keyless VM publisher is the single writer of
# live-transit/philadelphia/data/ (KAES-19). SEPTA is keyless
# agency-direct (A3 custody), so this job holds no source keys
# at all; KAES-17 is satisfied vacuously.
#
# Cadence (KAES-18 as adapted): the native */5 cron is retained
# in the file while the VM watchdog (chain/phl_feed_watchdog.py,
# 2-minute tick, dispatch at served age >420 s, min interval
# 300 s) is the standing mechanism — GitHub's scheduler alone
# has never held this city's cadence (measured 2026-10-23).

name: phl-feed-rebuild

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: phl-feed-rebuild-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout (pipeline code from main)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          path: main-checkout
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Collect raw bundle (fetch-only, per-leg isolated)
        working-directory: main-checkout/live-transit/philadelphia/pipeline
        run: |
          python3 collect.py --bundle-dir "$RUNNER_TEMP/bundle"
          echo "collected_at=$(python3 -c "import json;print(json.load(open('$RUNNER_TEMP/bundle/manifest.json'))['collected_at'])")" >> "$GITHUB_ENV"
      - name: Publish raw bundle to orphan branch (manifest last)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch phl-feed-raw \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" raw-repo \
            || { mkdir raw-repo && cd raw-repo && git init -b phl-feed-raw && \
                 git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"; }
          cd raw-repo
          git config user.name "phl-feed-rebuild-collect"
          git config user.email "actions@github.com"
          mkdir -p "bundles/${collected_at}"
          cp "$RUNNER_TEMP/bundle"/*.pb "bundles/${collected_at}/"
          # manifest LAST — its presence marks the bundle complete
          cp "$RUNNER_TEMP/bundle/manifest.json" "bundles/${collected_at}/manifest.json"
          git add -A
          git commit -m "phl raw bundle ${collected_at}"
          git push origin phl-feed-raw
