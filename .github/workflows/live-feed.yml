name: Live transit feed (static JSON)

# Publishes the Live Transit Detroit live feed as static JSON in
# live-data/ (vehicles.json, alerts.json), served by GitHub Pages and
# consumed by live-transit.html. Replaced the Netlify proxy
# (forge-line-live-proxy), which Netlify quota-paused on 2026-10-15
# (HTTP 503 usage_exceeded on all paths). Migration record:
# goals documentation in the DAA workspace (feed-migration, 2026-10-15).
#
# Cadence note: GitHub Actions scheduled runs are best-effort and can
# be delayed or dropped under load — the same behavior this account
# measured for scheduled polling in 2026-10 (see the retired proxy's
# log-telemetry header). The JSON carries an honest generated_at and
# the page displays that timestamp, so a delayed run shows as older
# data, never as fresh data.
#
# Why the deploy dispatch below exists: pushes made with the built-in
# GITHUB_TOKEN do not trigger other workflows (GitHub's recursion
# guard), so the feed commit would not fire deploy-pages.yml on its
# own. workflow_dispatch is exempt from that guard, so this workflow
# dispatches the Pages deploy explicitly after a commit lands.
#
# Secrets (set by the repo owner; never committed):
#   DDOT_BUSTIME_KEY — DDOT Clever Devices BusTime API key (the same
#   key the Netlify proxy held as DDOT_KEY). Until it is set, the feed
#   publishes the QLINE leg live and reports the DDOT leg as a named
#   not-configured state; nothing is fabricated.
#   SWIFTLY_KEY — Swiftly realtime API key for SMART GTFS-RT vehicle
#   positions (requested 2026-10-13; issued to the repo owner by
#   email). OPTIONAL and dormant: until it is set, the builder's SMART
#   leg performs zero network calls and every output is identical to
#   the pre-SMART build. When set, SMART vehicles are written ONLY to
#   live-data/smart-display.json (display-only under the Swiftly API
#   License Agreement §4(vi); never merged into vehicles.json, never
#   archived by the telemetry logger).

on:
  # Project 30 cutover (2026-10-19): the */5 cron is REMOVED — the
  # keyless VM publisher chain (feed-collect + feed-publisher) is the
  # feed's writer now, and a cron-fired run of this workflow would be
  # a second writer. This workflow remains intact as the FALLBACK:
  # workflow_dispatch (manual, or the dispatch driver's backstop
  # target at 20 minutes of served age) runs the full keyed build
  # exactly as before.
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: live-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22' # 22 LTS — Node 20 is EOL since 2026-04-30 and unpatched (R4; analysis S1.1)

      - name: Poll upstreams and rebuild live-data JSON
        env:
          DDOT_BUSTIME_KEY: ${{ secrets.DDOT_BUSTIME_KEY }}
          SWIFTLY_KEY: ${{ secrets.SWIFTLY_KEY }}
        run: node tools/feed/build-feed.mjs

      - name: Commit if changed
        id: commit
        env:
          DDOT_BUSTIME_KEY: ${{ secrets.DDOT_BUSTIME_KEY }}
          SWIFTLY_KEY: ${{ secrets.SWIFTLY_KEY }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add live-data/vehicles.json live-data/alerts.json
          # smart-display.json exists only while SWIFTLY_KEY is set.
          # Stage it when present (create/update) or tracked (a tracked
          # file the builder deleted because the key was withdrawn —
          # the deletion must be committed so the payload stops being
          # served). -A covers both; the guard avoids a pathspec error
          # in the never-existed case.
          if [ -e live-data/smart-display.json ] || git ls-files --error-unmatch live-data/smart-display.json >/dev/null 2>&1; then
            git add -A -- live-data/smart-display.json
          fi
          # smart-trip-updates.json: same lifecycle as
          # smart-display.json — exists
          # only while SWIFTLY_KEY is set; stage it when present or
          # tracked so a key withdrawal commits its deletion too.
          if [ -e live-data/smart-trip-updates.json ] || git ls-files --error-unmatch live-data/smart-trip-updates.json >/dev/null 2>&1; then
            git add -A -- live-data/smart-trip-updates.json
          fi
          # smart-tu/ (Project 29 watch derivative): same lifecycle — the
          # directory exists only while SWIFTLY_KEY is set; stage it when
          # present on disk or tracked, so creates, updates and deletions
          # (a key withdrawal removes the whole directory) are committed.
          if [ -d live-data/smart-tu ] || [ -n "$(git ls-files -- live-data/smart-tu)" ]; then
            git add -A -- live-data/smart-tu/
          fi
          if git diff --cached --quiet; then
            echo "No material change; nothing to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Race-hardened push (Project 30, RC3): a sibling run or a site
          # push can advance main on these same files between checkout and
          # push. On a rebase conflict or a lost push race, rebuild the
          # feed on the new tip (the builder's bulletin-reuse read sees
          # the newest committed alerts.json) and retry, 3 attempts,
          # then fail loud. Mirrors build-timing.yml's proven pattern.
          for attempt in 1 2 3; do
            git commit -m "live-data: feed update $(date -u +%Y-%m-%dT%H:%MZ)"
            git fetch origin main
            if ! git rebase origin/main; then
              echo "rebase conflict (attempt $attempt): rebuilding on new tip"
              git rebase --abort
              git reset --hard origin/main
              node tools/feed/build-feed.mjs
              git add live-data/vehicles.json live-data/alerts.json
              if [ -e live-data/smart-display.json ] || git ls-files --error-unmatch live-data/smart-display.json >/dev/null 2>&1; then
                git add -A -- live-data/smart-display.json
              fi
              if [ -e live-data/smart-trip-updates.json ] || git ls-files --error-unmatch live-data/smart-trip-updates.json >/dev/null 2>&1; then
                git add -A -- live-data/smart-trip-updates.json
              fi
              # smart-tu/ (Project 29 watch derivative): same lifecycle — the
              # directory exists only while SWIFTLY_KEY is set; stage it when
              # present on disk or tracked, so creates, updates and deletions
              # (a key withdrawal removes the whole directory) are committed.
              if [ -d live-data/smart-tu ] || [ -n "$(git ls-files -- live-data/smart-tu)" ]; then
                git add -A -- live-data/smart-tu/
              fi
              if git diff --cached --quiet; then
                echo "Rebuild on new tip produced no change."
                echo "pushed=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              continue
            fi
            if git push origin HEAD:main; then
              echo "pushed on attempt $attempt"
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "push raced (attempt $attempt); rebuilding on new tip"
            git reset --hard origin/main
            node tools/feed/build-feed.mjs
            git add live-data/vehicles.json live-data/alerts.json
            if [ -e live-data/smart-display.json ] || git ls-files --error-unmatch live-data/smart-display.json >/dev/null 2>&1; then
              git add -A -- live-data/smart-display.json
            fi
            if [ -e live-data/smart-trip-updates.json ] || git ls-files --error-unmatch live-data/smart-trip-updates.json >/dev/null 2>&1; then
              git add -A -- live-data/smart-trip-updates.json
            fi
            # smart-tu/ (Project 29 watch derivative): same lifecycle — the
            # directory exists only while SWIFTLY_KEY is set; stage it when
            # present on disk or tracked, so creates, updates and deletions
            # (a key withdrawal removes the whole directory) are committed.
            if [ -d live-data/smart-tu ] || [ -n "$(git ls-files -- live-data/smart-tu)" ]; then
              git add -A -- live-data/smart-tu/
            fi
            if git diff --cached --quiet; then
              echo "Rebuild on new tip produced no change."
              echo "pushed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo 'failed to push after 3 attempts' >&2
          exit 1

      - name: Dispatch Pages deploy for the new feed files
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
