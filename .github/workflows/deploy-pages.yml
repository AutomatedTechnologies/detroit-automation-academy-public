name: Deploy site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Prepare Deployment Directory
        run: |
          echo "Preparing deployment directory..."
          mkdir -p deployment/curriculum

          # Copy all root HTML, CSS, JS, and shell scripts (dynamic collection)
          cp *.html deployment/ || echo "No HTML files found"
          cp *.sh deployment/   || echo "No shell scripts found"
          cp *.css deployment/ || echo "No CSS files found"
          cp *.js deployment/ || echo "No JS files found"
          cp *.json deployment/ || echo "No JSON files found"
          
          # Copy system metadata
          cp CNAME deployment/               || echo "CNAME not found"
          cp .nojekyll deployment/           || echo ".nojekyll not found"
          cp robots.txt deployment/          || echo "robots.txt not found"
          cp sitemap.xml deployment/         || echo "sitemap.xml not found"
          cp feed.xml deployment/            || echo "feed.xml not found"
          cp feed.xsl deployment/            || echo "feed.xsl not found"
          cp -r feed deployment/             || echo "feed/ not found"

          # Copy curriculum silo
          if [ -d "curriculum" ]; then
            cp -r curriculum/* deployment/curriculum/
          fi

          # Copy Signal newsletter archive
          if [ -d "signal" ]; then
            cp -r signal deployment/ || echo "signal copy failed"
          fi

          # Copy Engineering series
          if [ -d "engineering" ]; then
            cp -r engineering deployment/ || echo "engineering copy failed"
            cp -r live-transit-detroit deployment/ || echo "live-transit-detroit copy failed"
          fi

          # Copy The Press (Just the Facts)
          if [ -d "press" ]; then
            cp -r press deployment/ || echo "press copy failed"
            cp -r apple-learning-coach deployment/ || echo "apple-learning-coach copy failed"
          fi

          if [ -d "watch" ]; then
            cp -r watch deployment/ || echo "watch copy failed"
          fi

          # Copy live transit feed data (static JSON published by the
          # live-feed workflow; consumed by live-transit.html)
          if [ -d "live-data" ]; then
            cp -r live-data deployment/ || echo "live-data copy failed"
          fi

          # Copy asset directories
          cp -r assets deployment/   || (mkdir -p deployment/assets   && echo "assets dir created empty")
          cp -r branding deployment/ || (mkdir -p deployment/branding && echo "branding dir created empty")
          cp -r qr_codes deployment/ || (mkdir -p deployment/qr_codes && echo "qr_codes dir created empty")

          # Copy Notes (technical notes, migrated from retired blog)
          if [ -d "notes" ]; then
            cp -r notes deployment/ || echo "notes copy failed"
          fi

          # Copy blog redirect stubs (old /blog/ URLs -> /notes/)
          if [ -d "blog" ]; then
            cp -r blog deployment/ || echo "blog stubs copy failed"
          fi

          # Copy Find redirect (/find/ -> /find.html)
          if [ -d "find" ]; then
            cp -r find deployment/ || echo "find copy failed"
          fi

          # Copy Departure Board (Project 29 successor — watch-parity board)
          if [ -d "board" ]; then
            cp -r board deployment/ || echo "board copy failed"
          fi

          # Copy Releases (Project 42 — public releases page)
          if [ -d "releases" ]; then
            cp -r releases deployment/ || echo "releases copy failed"
          fi

          # Copy Live Transit cities (hub + per-city pages/assets;
          # Philadelphia MVP, 2026-10-23)
          if [ -d "live-transit" ]; then
            cp -r live-transit deployment/ || echo "live-transit copy failed"
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./deployment

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

