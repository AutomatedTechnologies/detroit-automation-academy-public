name: Deploy site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # Pre-deploy verification (CI/CD adoption, 2026-11-01). The deploy
  # runs ONLY behind these gates: a push whose code/shell/manifest
  # bytes break the shell contract, the build manifests, or
  # referential integrity never reaches Pages. Data-only pushes
  # (the feed publishers' cadence) skip the heavy gates — they
  # carry no code — so the feed's deploy cadence is unchanged.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      code_changed: ${{ steps.scope.outputs.code_changed }}
      verdict: ${{ steps.evidence.outputs.verdict }}
      evidence_class: ${{ steps.evidence.outputs.evidence_class }}
    steps:
      # Shallow checkout: this repo's full history is heavy and the
      # verify stage runs ahead of every deploy (incl. the feed
      # cadence). The scope step only needs the push's `before`
      # commit; if it is not in the shallow window it falls back
      # to running the full gates (the safe default).
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2

      - name: Determine change scope
        id: scope
        run: |
          if [ "${{ github.event_name }}" != "push" ] || [ -z "${{ github.event.before }}" ] || [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            echo "scope: non-push or first push — full gates"
            exit 0
          fi
          if ! git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            echo "scope: before-commit outside shallow window — full gates (safe default)"
            exit 0
          fi
          changed="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")"
          printf '%s\n' "$changed"
          if [ -z "$changed" ]; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            echo "scope: empty diff — full gates (safe default)"
          elif printf '%s\n' "$changed" | grep -qvE '^(live-data/|live-transit/[^/]+/data/|feed-raw/)'; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            echo "scope: code/shell/manifest paths changed — full gates"
          else
            echo "code_changed=false" >> "$GITHUB_OUTPUT"
            echo "scope: data-only push — heavy gates skipped (feed cadence)"
            for g in shell-contract manifest-recompute ref-integrity; do
              echo "EVIDENCE gate=$g class=bytes verdict=skip" >> gate-skipped.log
            done
          fi

      - name: Shell-contract gate
        if: steps.scope.outputs.code_changed == 'true'
        run: |
          set -eo pipefail
          python3 tools/cicd/shell_contract.py 2>&1 | tee gate-shell.log

      - name: Build-manifest recompute gate
        if: steps.scope.outputs.code_changed == 'true'
        run: |
          set -eo pipefail
          python3 tools/cicd/manifest_check.py 2>&1 | tee gate-manifest.log

      - name: Referential-integrity gate
        if: steps.scope.outputs.code_changed == 'true'
        run: |
          set -eo pipefail
          python3 tools/cicd/ref_integrity.py 2>&1 | tee gate-ref.log

      # Headline verdict with its evidence class (lowest present;
      # an all-skipped stage reports SKIP / class claim — it
      # verified nothing and says so).
      - name: Evidence verdict
        id: evidence
        if: always()
        run: |
          for f in gate-shell.log gate-manifest.log gate-ref.log gate-skipped.log; do
            [ -f "$f" ] || touch "$f"
          done
          python3 tools/cicd/evidence_verdict.py \
            gate-shell.log gate-manifest.log gate-ref.log gate-skipped.log \
            | tee evidence-verdict.txt

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Prepare Deployment Directory
        run: |
          echo "Preparing deployment directory..."
          mkdir -p deployment/curriculum

          # Copy all root HTML, CSS, JS, and shell scripts (dynamic collection)
          cp *.html deployment/ || echo "No HTML files found"
          cp *.css deployment/ || echo "No CSS files found"
          cp *.js deployment/ || echo "No JS files found"
          # Root JSON is an explicit allowlist (security remediation R2,
          # 2026-10-23): the previous `cp *.json` / `cp *.sh` globs
          # published any root data/script file by default — that is how
          # an internal pre-launch shell script shipped publicly. A new
          # root .json data file must be added here deliberately; root
          # shell scripts are never site content and are not copied.
          for f in build-manifest.json commentary.json ddot-fleet.json ddot-routes-3d.json ddot-timetable-S1000182.json geometry-manifest.json landmarks.json live.json peoplemover-3d.json places.json planner-timetable-S1000182-S1000147.json qline-3d.json search-index.json smart-routes-3d.json; do
            cp "$f" deployment/ || echo "allowlisted JSON missing: $f"
          done
          
          # Copy system metadata
          cp CNAME deployment/               || echo "CNAME not found"
          cp .nojekyll deployment/           || echo ".nojekyll not found"
          cp -r .well-known deployment/     || echo ".well-known not found"
          cp robots.txt deployment/          || echo "robots.txt not found"
          cp sitemap.xml deployment/         || echo "sitemap.xml not found"
          cp feed.xml deployment/            || echo "feed.xml not found"
          cp feed.xsl deployment/            || echo "feed.xsl not found"
          cp -r feed deployment/             || echo "feed/ not found"

          # Copy curriculum silo
          if [ -d "curriculum" ]; then
            cp -r curriculum/* deployment/curriculum/
          fi

          # Copy Signal newsletter archive
          if [ -d "signal" ]; then
            cp -r signal deployment/ || echo "signal copy failed"
          fi

          # Copy Engineering series
          if [ -d "engineering" ]; then
            cp -r engineering deployment/ || echo "engineering copy failed"
            cp -r live-transit-detroit deployment/ || echo "live-transit-detroit copy failed"
          fi

          # Copy The Press (Just the Facts)
          if [ -d "press" ]; then
            cp -r press deployment/ || echo "press copy failed"
            cp -r apple-learning-coach deployment/ || echo "apple-learning-coach copy failed"
          fi

          if [ -d "watch" ]; then
            cp -r watch deployment/ || echo "watch copy failed"
          fi

          # Copy live transit feed data (static JSON published by the
          # live-feed workflow; consumed by live-transit.html)
          if [ -d "live-data" ]; then
            cp -r live-data deployment/ || echo "live-data copy failed"
          fi

          # Copy asset directories
          cp -r assets deployment/   || (mkdir -p deployment/assets   && echo "assets dir created empty")
          cp -r branding deployment/ || (mkdir -p deployment/branding && echo "branding dir created empty")
          cp -r qr_codes deployment/ || (mkdir -p deployment/qr_codes && echo "qr_codes dir created empty")

          # Copy Notes (technical notes, migrated from retired blog)
          if [ -d "notes" ]; then
            cp -r notes deployment/ || echo "notes copy failed"
          fi

          # Copy blog redirect stubs (old /blog/ URLs -> /notes/)
          if [ -d "blog" ]; then
            cp -r blog deployment/ || echo "blog stubs copy failed"
          fi

          # Copy Find redirect (/find/ -> /find.html)
          if [ -d "find" ]; then
            cp -r find deployment/ || echo "find copy failed"
          fi

          # Copy Departure Board (Project 29 successor — watch-parity board)
          if [ -d "board" ]; then
            cp -r board deployment/ || echo "board copy failed"
          fi

          # Copy Releases (Project 42 — public releases page)
          if [ -d "releases" ]; then
            cp -r releases deployment/ || echo "releases copy failed"
          fi

          # Copy Live Transit cities (hub + per-city pages/assets;
          # Philadelphia MVP, 2026-10-23)
          if [ -d "live-transit" ]; then
            cp -r live-transit deployment/ || echo "live-transit copy failed"
          fi

          # Copy Voter Guide (app shell + geography surface;
          # Board 62 Integration 1 promotion, 2026-10-26 — the
          # directory was never in the copy list, so /voter-guide/*
          # 404'd despite the files being in the repo)
          if [ -d "voter-guide" ]; then
            cp -r voter-guide deployment/ || echo "voter-guide copy failed"
          fi

          # Copy planner assets (Cities V2 Detroit bundle, T6.6,
          # 2026-10-31 — the modular Detroit page loads its planner
          # timetable from planner/assets/; the directory was never
          # in the copy list, so the files 404'd despite being in
          # the repo — same failure class as voter-guide above)
          if [ -d "planner" ]; then
            cp -r planner deployment/ || echo "planner copy failed"
          fi

          # Copy The Index (site-wide index; linked from the header nav
          # and the footer of every page — the directory was never in
          # the copy list, so /the-index/ 404'd in production despite
          # the files being in the repo; owner defect report
          # 2026-11-05, same failure class as voter-guide/planner above)
          if [ -d "the-index" ]; then
            cp -r the-index deployment/ || echo "the-index copy failed"
          fi

          # Copy Forge Keyboard (iOS keyboard page + download, placed
          # 2026-11-05 — same copy-list omission: promoted to the repo
          # but never copied into the deployment artifact)
          if [ -d "ios-keyboard" ]; then
            cp -r ios-keyboard deployment/ || echo "ios-keyboard copy failed"
          fi

          # Copy The Index + iOS keyboard distribution (V2 launch directories,
          # 2026-11-05 — absent from the list, both served the estate 404)
          if [ -d "the-index" ]; then
            cp -r the-index deployment/ || echo "the-index copy failed"
          fi

          if [ -d "ios-keyboard" ]; then
            cp -r ios-keyboard deployment/ || echo "ios-keyboard copy failed"
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./deployment

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  # Post-deploy self-detection (CI/CD adoption, 2026-11-01):
  # served bytes are compared against the deployed tree, and —
  # for code/shell deploys — every city page must actually BOOT
  # in a real headless Chromium (the 2026-10-31 incident was
  # invisible to byte checks: the bytes were right, the page was
  # dead). Detection + alarm only: on failure this job opens an
  # issue naming the stage and city; automatic rollback is a
  # separate tranche, deliberately not in scope here.
  postdeploy:
    needs: [deploy, verify]
    runs-on: ubuntu-latest
    # Hard backstop: a stuck verification step must never hold
    # the `pages` concurrency group (and every queued deploy)
    # hostage — the 2026-11-01 run 41275380038 lesson.
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Served-byte verification
        id: served
        timeout-minutes: 15
        run: |
          set -eo pipefail
          if [ "${{ needs.verify.outputs.code_changed }}" = "true" ]; then
            python3 tools/cicd/served_verify.py --mode full --budget 600 2>&1 | tee gate-served.log
          else
            python3 tools/cicd/served_verify.py --mode shells --budget 600 2>&1 | tee gate-served.log
          fi

      - name: Boot smoke check
        id: smoke
        if: needs.verify.outputs.code_changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          set -eo pipefail
          cd tools/cicd
          npm init -y >/dev/null 2>&1
          npm install puppeteer@23.11.1 --no-audit --no-fund
          node boot_smoke.mjs --out smoke-summary.json 2>&1 | tee ../../gate-smoke.log

      # Post-deploy evidence verdict: served-verify is the bytes
      # class; boot smoke is the behavior class — when it runs,
      # it is part of the set; the headline stays the lowest
      # class present.
      - name: Evidence verdict (post-deploy)
        if: always()
        run: |
          if [ ! -f gate-smoke.log ]; then
            echo "EVIDENCE gate=boot-smoke class=behavior verdict=skip" > gate-smoke.log
          fi
          python3 tools/cicd/evidence_verdict.py \
            gate-served.log gate-smoke.log | tee evidence-verdict.txt

      - name: Alarm — open issue on post-deploy failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          stage="served-bytes"
          cities=""
          if [ -f tools/cicd/smoke-summary.json ]; then
            stage="boot-smoke"
            cities="$(python3 -c "import json; d=json.load(open('tools/cicd/smoke-summary.json')); print(', '.join(r['city'] for r in d if not r['booted']) or 'unknown')")"
          fi
          echo "::error title=Post-deploy verification failed::stage=${stage} cities=${cities} sha=${GITHUB_SHA}"
          {
            echo "Post-deploy verification failed for commit ${GITHUB_SHA}."
            echo ""
            echo "- stage: ${stage}"
            echo "- failing cities: ${cities:-n/a (served-byte stage)}"
            echo "- run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            if [ -f evidence-verdict.txt ]; then
              echo "- evidence: $(grep RELEASE-VERDICT evidence-verdict.txt || true)"
            fi
            echo ""
            echo "Detection only — no automatic rollback exists yet (CI/CD adoption record, 2026-11-01). If a page is down for riders, revert first per standing doctrine, then diagnose."
            if [ -f tools/cicd/smoke-summary.json ]; then
              echo ""
              echo "Boot smoke summary:"
              echo '```json'
              cat tools/cicd/smoke-summary.json
              echo '```'
            fi
          } > issue-body.md
          gh label create ci-cd --color B60205 --description "CI/CD pipeline alarms" --force || true
          gh issue create --title "[post-deploy] ${stage} failed${cities:+ — }${cities} @ ${GITHUB_SHA:0:7}" --body-file issue-body.md --label ci-cd || \
            gh issue create --title "[post-deploy] ${stage} failed @ ${GITHUB_SHA:0:7}" --body-file issue-body.md
