name: DAA Public CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    # Machine-churn paths (security remediation R4, 2026-10-23): the
    # feed publisher's live-data commits and the PHL collector's data
    # commits land every few minutes and carry no code; running the
    # full pipeline on them produced thousands of runs (and, while a
    # lint failure stood, a failure email per run). They no longer
    # trigger CI on push. The pull_request trigger below is unchanged.
    paths-ignore:
      - 'live-data/**'
      - 'live-transit/philadelphia/data/**'
  pull_request:
    branches: [main, develop]

# Least privilege (R4): every job in this workflow only reads the repo.
permissions:
  contents: read

jobs:
  python-lint-and-format:
    runs-on: ubuntu-latest
    name: Python Lint & Format

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black==26.10.1 flake8==7.4.1 bandit==1.9.4

      - name: Check code formatting with Black
        run: black --check .

      - name: Lint with Flake8
        run: flake8 --max-line-length=88 --extend-ignore=E203,W503 --exclude=node_modules,.git,__pycache__,venv,blog-source/themes .

      - name: Security scan with Bandit
        run: bandit -r . -x ./venv -q

  # The Go Backend Build & Lint job was removed 2026-10-23 (R2/R4):
  # the CRM it built moved to the private repo
  # (AutomatedTechnologies/detroit-automation-academy-internal), whose
  # own CI now builds it on a supported Go line. Keeping the job here
  # would fail every run against a directory that no longer exists.

  documentation:
    runs-on: ubuntu-latest
    name: Documentation Validation

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check required documentation
        run: |
          required_files=("README.md" "LICENSE")
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing required documentation: $file"
              exit 1
            fi
          done
          echo "✓ All required documentation present"

  stamp-discipline:
    runs-on: ubuntu-latest
    name: Stamp Discipline (warn-first)

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      # Warn-first (project 28, register C-15): a shared stamped asset
      # whose bytes change without a ?v= stamp bump on any referencing
      # page leaves returning visitors on the cached asset — the
      # Find-lane failure of 2026-10-16. The check prints ::warning::
      # annotations and exits 0 in this phase. Promotion to a hard
      # gate: drop --warn (see tools/check_stamps.py).
      - name: Check shared-asset stamp discipline
        if: github.event_name == 'push'
        run: python3 tools/check_stamps.py --base HEAD~1 --warn
