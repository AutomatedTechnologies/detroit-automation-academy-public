name: Swiftly leg test (temporary)

# TEMPORARY verification workflow (round 3 -- negative controls),
# 2026-10-15. Round 2 showed the placed key returns 403 (not 401)
# in raw-header and apiKey forms against the granted VP endpoint.
# These controls use a deliberately BOGUS key value (the real key is
# not used, touched, or risked) to distinguish "403 = the server read
# the credential but the key lacks this agency" from "403 = a mere
# format gate". Status codes only; bodies discarded unread.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Negative-control probes (bogus key value)
        run: |
          URL="https://api.goswift.ly/real-time/smart/gtfs-rt-vehicle-positions"
          BOGUS="bogus-control-value-not-a-key"
          c1="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -H "Authorization: $BOGUS" "$URL")"
          echo "control raw-header bogus -> HTTP $c1"
          c2="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -H "Authorization: Bearer $BOGUS" "$URL")"
          echo "control bearer-header bogus -> HTTP $c2"
          c3="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$URL?apiKey=$BOGUS")"
          echo "control apiKey-query bogus -> HTTP $c3"
          c4="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$URL")"
          echo "control no-credential -> HTTP $c4"
