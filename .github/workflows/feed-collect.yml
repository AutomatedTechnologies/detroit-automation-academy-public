name: Feed collect (raw source payloads)

# Project 30 keyless split (2026-10-19): the API keys never leave
# GitHub Actions, so this workflow performs ONLY the keyed source
# fetches for the Live Transit feed — DDOT BusTime getvehicles +
# getservicebulletins, Swiftly GTFS-RT vehicle positions + trip
# updates, and the public QLINE GTFS-RT feed — and commits the RAW
# payloads, with fetch outcomes and timestamps, as a feed-raw-bundle/v1
# to the feed-raw orphan branch (path raw-feed/current/). No build, no
# transform, no deploy: the VM feed-publisher consumes the bundle,
# runs the builder's transform half locally as single writer, commits
# the finished feed files to main and dispatches the Pages deploy.
#
# The builder script itself runs in collect mode (FEED_COLLECT_DIR):
# the same file, the same fetch code — its fetch cadence REPLACES the
# live build's fetches (including the 55-minute bulletin sub-cadence,
# decided against the previous bundle's manifest), so the DDOT draw
# does not double. The publisher makes zero source calls.
#
# Triggers: workflow_dispatch + a coarse schedule floor (every
# 15 minutes; resilience tranche 2026-10-26,
# feed-resilience-2026-10-26.md D5). HISTORICAL NOTE (superseded
# 2026-11-12 by the publish/chain jobs below): cadence was owned by
# the VM (the publisher dispatched on bundle age; the dispatch
# driver backstopped on served age). The schedule
# is only a floor: it runs on GITHUB_TOKEN, whose quota is per-repo
# and independent of the PAT window the VM consumers share, so
# bundles keep flowing at reduced cadence even if the VM is dead or
# its consumers are parked on an exhausted PAT quota. GitHub's
# scheduler delivers ~2.4% of */5 crons in this account (measured,
# Project 30 diagnosis) — at */15 the floor is a backstop, never the
# cadence owner. Overlap is safe: this workflow's concurrency group
# serializes runs, the commit step no-ops on a byte-identical bundle,
# and the publisher keys on bundle commit identity, so a floor bundle
# can never double-publish.
# The orphan branch keeps the site repo's Pages copy list (built from
# main) and CI (branches: main/develop) untouched, and GITHUB_TOKEN
# pushes trigger no workflows.
#
# Secrets (repo owner; never committed): DDOT_BUSTIME_KEY,
# SWIFTLY_KEY — the same Actions secrets live-feed.yml uses. Absent
# key = the leg records its dormant/not-configured state and makes
# zero calls, exactly as the builder's legs behave.

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: feed-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (builder script)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: src

      - name: Checkout feed-raw branch (previous bundle)
        run: |
          if git ls-remote --exit-code --heads https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git feed-raw >/dev/null 2>&1; then
            git clone --depth 1 --branch feed-raw \
              https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git prev
          else
            echo "feed-raw branch absent; bootstrapping empty"
            mkdir -p prev/raw-feed
          fi

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22' # 22 LTS — Node 20 is EOL since 2026-04-30 and unpatched (R4; analysis S1.1)

      - name: Collect raw source payloads
        env:
          DDOT_BUSTIME_KEY: ${{ secrets.DDOT_BUSTIME_KEY }}
          SWIFTLY_KEY: ${{ secrets.SWIFTLY_KEY }}
          FEED_COLLECT_DIR: ${{ runner.temp }}/bundle
          FEED_PREV_BUNDLE_DIR: ${{ github.workspace }}/prev/raw-feed/current
        run: node src/tools/feed/build-feed.mjs

      - name: Commit bundle to feed-raw branch
        run: |
          cd prev
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ ! -d .git ]; then
            git init -b feed-raw .
            git remote add origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          fi
          rm -rf raw-feed/current
          mkdir -p raw-feed
          cp -r "$RUNNER_TEMP/bundle" raw-feed/current
          if [ ! -f raw-feed/README.md ]; then
            cat > raw-feed/README.md <<'EOF'
          # feed-raw — raw feed payload bundles (Project 30)

          Orphan branch holding feed-raw-bundle/v1 payload bundles at
          `raw-feed/current/` (bundle.json manifest + raw source
          payloads), produced by the Feed collect workflow and consumed
          by the VM feed-publisher. Transient hand-off buffer, not an
          archive: only the newest bundle is kept at the tip.
          EOF
          fi
          git add -A
          if git diff --cached --quiet; then
            echo "Bundle identical to previous; nothing to commit."
            exit 0
          fi
          collected=$(node -e "console.log(JSON.parse(require('fs').readFileSync('raw-feed/current/bundle.json','utf8')).collected_at)")
          # Single writer (this workflow's concurrency group), but keep
          # the house race pattern: fetch + rebase + retry x3, fail loud.
          for attempt in 1 2 3; do
            git commit -m "feed-raw: collect ${collected} [skip ci]"
            if git push origin HEAD:feed-raw; then
              echo "bundle pushed on attempt $attempt"
              exit 0
            fi
            echo "push raced (attempt $attempt); rebasing"
            git fetch origin feed-raw
            git rebase origin/feed-raw || { git rebase --abort; git reset --hard origin/feed-raw; }
          done
          echo 'failed to push bundle after 3 attempts' >&2
          exit 1

  # Actions publisher (2026-11-12, LTD VM removal — owner directive:
  # the production path must not depend on the agent VM). The merge /
  # adherence / quality / publish half that ran on the VM under
  # feed-publisher.timer now runs here, in the same serialized run
  # as the collect that produced the bundle. The publisher code of
  # record is tools/feed/feed-publisher.py (vendored from the VM
  # phase4 copy with surgical adaptations, each commented at its
  # site: GH_TOKEN auth, FEED_NODE, proxy guard, mirror skip,
  # feed-only deploy dispatch). It publishes to main with the same
  # commit shape as the VM publisher and dispatches deploy-pages.yml
  # with feed_only=true, which reproduces the data-only fast path.
  # The data-repo mirror is owned by the data repo's own
  # feed-mirror.yml: this repo's GITHUB_TOKEN cannot write across
  # repos, and needs no credential to read this public repo.
  # Gated by the FEED_PUBLISH repo variable (anything but "on" skips
  # the job), so landing this workflow changed nothing until
  # cutover. Bulletin carry state (GF-1) round-trips through the
  # feed-raw branch under publisher-state/ — the only publisher
  # state that must survive between runs; everything else in work/
  # is cache and re-derives cold.
  publish:
    needs: collect
    if: vars.FEED_PUBLISH == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout main (publisher)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: src

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Checkout feed-raw branch (publisher state)
        run: |
          git clone --depth 1 --branch feed-raw \
            https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git rawstate

      - name: Restore bulletin carry state
        run: |
          mkdir -p src/tools/feed/work
          for f in bulletin-carry.json bulletin-recovered.json; do
            if [ -f "rawstate/publisher-state/$f" ]; then
              cp "rawstate/publisher-state/$f" "src/tools/feed/work/$f"
            fi
          done

      - name: Publish feed to main
        env:
          GH_TOKEN: ${{ github.token }}
          FEED_PUBLISHER_SKIP_MIRROR: "1"
          FEED_PUBLISHER_FEED_ONLY_DEPLOY: "1"
        run: |
          export FEED_NODE="$(command -v node)"
          cd src/tools/feed
          python3 feed-publisher.py

      - name: Persist bulletin carry state
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/pubstate"
          found=0
          for f in bulletin-carry.json bulletin-recovered.json; do
            if [ -f "src/tools/feed/work/$f" ]; then
              cp "src/tools/feed/work/$f" "$RUNNER_TEMP/pubstate/$f"
              found=1
            fi
          done
          if [ "$found" = "0" ]; then
            echo "no bulletin state produced this run; nothing to persist"
            exit 0
          fi
          cd rawstate
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p publisher-state
          cp "$RUNNER_TEMP"/pubstate/*.json publisher-state/
          git add publisher-state
          if git diff --cached --quiet; then
            echo "publisher state already current on feed-raw"
            exit 0
          fi
          git commit -m "publisher-state: bulletin carry update [skip ci]"
          # Same house race pattern as the bundle commit: fetch +
          # rebase + retry x3, fail loud.
          for attempt in 1 2 3; do
            if git push origin HEAD:feed-raw; then
              echo "publisher state pushed on attempt $attempt"
              exit 0
            fi
            echo "push raced (attempt $attempt); rebasing"
            git fetch origin feed-raw
            git rebase origin/feed-raw || { git rebase --abort; echo 'publisher-state rebase conflict; failing loud, next cycle retries fresh' >&2; exit 1; }
          done
          echo 'failed to push publisher state after 3 attempts' >&2
          exit 1

  # Self-dispatch chain (2026-11-12): GitHub's scheduler cannot hold
  # the ~4-minute feed cadence in this account (measured ~2.4% of
  # */5 crons delivered, Project 30 diagnosis), so each run
  # dispatches the next after a delay, and the */15 schedule floor
  # above restarts a dead chain. Single pending slot: if another run
  # is already queued or pending, it chains onward itself — runs
  # never pile up. Gated by FEED_CHAIN (anything but "on" skips).
  chain:
    needs: [collect, publish]
    if: always() && vars.FEED_CHAIN == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: Dispatch the next cycle
        env:
          GH_TOKEN: ${{ github.token }}
          CHAIN_DELAY_SEC: ${{ vars.FEED_CHAIN_DELAY_SEC }}
        run: |
          others=$(gh run list --repo "${{ github.repository }}" \
            --workflow feed-collect.yml --limit 15 \
            --json databaseId,status \
            --jq "[.[] | select(.databaseId != ${{ github.run_id }}) | select(.status == \"queued\" or .status == \"pending\" or .status == \"waiting\" or .status == \"in_progress\")] | length")
          if [ "${others:-0}" != "0" ]; then
            echo "chain: $others other run(s) active or queued; the queued run chains onward itself"
            exit 0
          fi
          delay="${CHAIN_DELAY_SEC:-120}"
          echo "chain: sleeping ${delay}s, then dispatching the next feed-collect run"
          sleep "$delay"
          gh workflow run feed-collect.yml --repo "${{ github.repository }}" --ref main
