<script>
(function () {
  'use strict';

  var SVGNS = 'http://www.w3.org/2000/svg';
  var reduced = false;
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
  catch (e) { reduced = false; }

  var rig = null, beam = null, halo = null, pool = null, status = null, liveDot = null;
  var stars = [];
  var ready = false;

  function el(id) { return document.getElementById(id); }

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function buildSkyline(rnd, host, base, dark, lit) {
    var x = -20;
    while (x < 620) {
      var w = 34 + rnd() * 60, h = 60 + rnd() * 90;
      var r = document.createElementNS(SVGNS, 'rect');
      r.setAttribute('x', x.toFixed(0));
      r.setAttribute('y', (base - h).toFixed(0));
      r.setAttribute('width', w.toFixed(0));
      r.setAttribute('height', (h + 130).toFixed(0));
      r.setAttribute('fill', dark);
      host.appendChild(r);
      if (lit) {
        var wins = 2 + Math.floor(rnd() * 5), i, wr;
        for (i = 0; i < wins; i++) {
          wr = document.createElementNS(SVGNS, 'rect');
          wr.setAttribute('x', (x + 6 + rnd() * Math.max(4, w - 14)).toFixed(0));
          wr.setAttribute('y', (base - h + 8 + rnd() * Math.max(4, h - 18)).toFixed(0));
          wr.setAttribute('width', '4');
          wr.setAttribute('height', '6');
          wr.setAttribute('fill', '#FFB000');
          wr.setAttribute('opacity', (0.25 + rnd() * 0.45).toFixed(2));
          host.appendChild(wr);
        }
      }
      x += w + 8 + rnd() * 22;
    }
  }

  function build() {
    if (ready) return;
    rig = el('rig'); beam = el('beamEl'); halo = el('haloEl');
    pool = el('poolEl'); status = el('statusText'); liveDot = el('liveDot');
    var rnd = mulberry32(20261001);
    var g = el('stars'), i, c;
    for (i = 0; i < 46; i++) {
      c = document.createElementNS(SVGNS, 'circle');
      c.setAttribute('cx', (rnd() * 600).toFixed(1));
      c.setAttribute('cy', (rnd() * 400).toFixed(1));
      c.setAttribute('r', (0.6 + rnd() * 1.3).toFixed(2));
      c.setAttribute('fill', '#F5F2EA');
      c.setAttribute('opacity', '0.4');
      g.appendChild(c);
      stars.push({ n: c, base: 0.22 + rnd() * 0.45, sp: 0.6 + rnd() * 1.8, ph: rnd() * 6.283 });
    }
    buildSkyline(rnd, el('cityFar'), 470, '#0B1116', false);
    buildSkyline(rnd, el('cityNear'), 500, '#04070A', true);
    ready = true;
  }

  var PHASES = ['SCANNING', 'TRACKING', 'SIGNAL LOCK'];

  function render(t) {
    build();
    var cx = 300 + 195 * Math.sin(t * 0.30);
    var cy = 95 + 10 * Math.sin(t * 0.45 + 1);
    rig.setAttribute('transform', 'translate(' + (cx - 103).toFixed(1) + ',' + cy.toFixed(1) + ')');
    beam.setAttribute('transform', 'rotate(' + (5 * Math.sin(t * 0.30 + 0.7)).toFixed(2) + ' 103 225)');
    halo.setAttribute('opacity', (0.85 + 0.15 * Math.sin(t * 2.1)).toFixed(3));
    pool.setAttribute('cx', cx.toFixed(1));
    pool.setAttribute('opacity', (0.08 + 0.04 * Math.sin(t * 2.1)).toFixed(3));
    liveDot.setAttribute('opacity', (0.55 + 0.45 * Math.sin(t * 4)).toFixed(3));
    var i, s;
    for (i = 0; i < stars.length; i++) {
      s = stars[i];
      s.n.setAttribute('opacity', (s.base + 0.2 * Math.sin(t * s.sp + s.ph)).toFixed(3));
    }
    var deg = Math.round(((cx - 300) / 195) * 60);
    status.textContent = 'AZ ' + (deg < 0 ? '-' + (-deg) : '+' + deg) + '\u00B0 \u00B7 ' +
      PHASES[Math.floor(t / 5) % 3];
  }

  /* Single-clock design: every moving thing is driven by this rAF loop.
     No CSS animations, no setInterval — so pause() freezes ALL motion. */
  var T = { t: 0, last: 0, running: false, raf: 0 };

  function frame(now) {
    if (!T.running) return;
    var dt = (now - T.last) / 1000;
    T.last = now;
    if (!(dt >= 0)) dt = 0;
    if (dt > 0.1) dt = 0.1;
    T.t += dt;
    render(T.t);
    T.raf = requestAnimationFrame(frame);
  }

  function nowMs() {
    return (window.performance && window.performance.now) ? window.performance.now() : Date.now();
  }

  function play() {
    build();
    if (T.running || reduced) return;
    T.running = true;
    T.last = nowMs();
    T.raf = requestAnimationFrame(frame);
  }

  function pause() {
    T.running = false;
    if (T.raf) { cancelAnimationFrame(T.raf); T.raf = 0; }
  }

  function restart() {
    build();
    T.t = 0;
    render(0);
    if (!reduced && !T.running) play();
  }

  window.restart = restart;   /* parent contract: called on scroll-into-view */
  window.pause = pause;       /* optional: parent may pause when scrolled out */
  window.play = play;

  if (reduced) { build(); render(8); }
  else { play(); }
})();
</script>
