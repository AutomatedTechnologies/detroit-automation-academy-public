<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Subscription Confirmed | Detroit Automation Academy</title>
    <link rel="stylesheet" href="../branding/palette.css">
    <style>
        body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 24px; background: var(--daa-bg); color: var(--daa-fg); font-family: var(--daa-body-font); }
        body::before { content: ''; position: fixed; inset: 0; z-index: -1; background: linear-gradient(135deg, transparent 0 48%, rgba(0, 107, 115, 0.08) 48% 52%, transparent 52%), linear-gradient(90deg, rgba(0, 107, 115, 0.08) 1px, transparent 1px), linear-gradient(rgba(0, 107, 115, 0.08) 1px, transparent 1px); background-size: auto, 72px 72px, 72px 72px; }
        main { width: min(100%, 560px); text-align: center; border: 1px solid var(--daa-border); border-radius: var(--daa-radius-lg); padding: clamp(32px, 8vw, 56px) 32px; background: var(--daa-bg-card); box-shadow: var(--daa-shadow-blue); }
        .status-mark { display: grid; place-items: center; width: 72px; height: 72px; margin: 0 auto 24px; border: 2px solid var(--daa-success); border-radius: 50%; color: var(--daa-success); font-size: 36px; font-weight: 700; }
        .eyebrow { margin: 0 0 12px; color: var(--daa-secondary); font-family: var(--daa-mono-font); font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
        h1 { margin: 0 0 16px; color: var(--daa-fg); font-family: var(--daa-display-font); font-size: clamp(2rem, 6vw, 3rem); text-transform: none; }
        p { color: var(--daa-fg-muted); line-height: 1.7; }
        a { display: inline-block; margin-top: 20px; padding: 13px 20px; border-radius: var(--daa-radius-sm); background: var(--daa-primary); color: #fff !important; font-weight: 700; text-decoration: none; }
        a:hover { background: var(--daa-primary-dark); }
    </style>
</head>
<body>
    <main>
        <div class="status-mark" aria-hidden="true">✓</div>
        <p class="eyebrow">Payment received</p>
        <h1>Subscription confirmed</h1>
        <p>Thank you for investing in your organization’s automation education. A confirmation email and next steps are on their way.</p>
        <a href="subscriptions.html">Return to subscriptions</a>
    </main>
</body>
</html>
